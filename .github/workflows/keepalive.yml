name: Keep Supabase awake

# Free Supabase projects pause after about a week with no activity. This makes one tiny read request
# every day so that never happens. See .github/scripts/keepalive.py.
on:
  schedule:
    - cron: "17 5 * * *" # every day at 05:17 UTC
  workflow_dispatch: # also lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: python3 .github/scripts/keepalive.py
