<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050816">
  <title>Page not found</title>
  <style>
    html, body { height: 100%; margin: 0; background: #050816; color: #f2f5ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: grid; place-content: center; gap: 12px; padding: 24px; text-align: center; }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #9aa6c7; }
    a { display: inline-block; margin-top: 8px; padding: 14px 24px; border-radius: 16px;
      background: #ff3b4a; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>🌍 Lost?</h1>
    <p>That page doesn't exist.</p>
    <!-- Relative link so it works under https://<user>.github.io/<repo>/ -->
    <a href="./">Back to the globe</a>
  </main>
</body>
</html>
