<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04070f">
  <script>
    /* same rule as the app: a saved choice wins, otherwise follow the phone's light/dark setting */
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('orbit.theme'); } catch (e) {}
      var light = saved ? saved === 'light' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches);
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>
  <title>Page not found | Orbit</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #04070f; --text: #eef1f8; --muted: #8e99b6; --ring: rgba(255, 255, 255, 0.12); color-scheme: dark; }
    :root[data-theme="light"] { --bg: #eef2fa; --text: #0f172a; --muted: #55607a; --ring: rgba(15, 23, 42, 0.14); color-scheme: light; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; }
    main { min-height: 100%; display: grid; place-content: center; justify-items: center; gap: 8px; padding: 24px; text-align: center; }
    img { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 0 0 1px var(--ring); }
    .code { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -0.02em; }
    p { margin: 0; color: var(--muted); }
    a { display: inline-block; margin-top: 18px; padding: 14px 24px; border-radius: 14px;
      background: #d92d43; color: #fff; font-weight: 600; text-decoration: none;
      transition: transform .15s, background .2s; }
    a:hover { background: #c9283c; }
    a:active { transform: scale(.98); }
  </style>
</head>
<body>
  <main>
    <img src="icon.svg" alt="">
    <p class="code">Error 404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist.</p>
    <!-- Relative link so it works under https://<user>.github.io/<repo>/ -->
    <a href="./">Back to Orbit</a>
  </main>
</body>
</html>
